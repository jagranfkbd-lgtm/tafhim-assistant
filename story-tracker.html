<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafhim's Story Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2a2a2a;
    --accent: #e8a020;
    --accent2: #c0392b;
    --green: #27ae60;
    --blue: #2980b9;
    --text: #e8e8e8;
    --muted: #888;
    --urgent: #e74c3c;
    --warning: #f39c12;
    --ok: #2ecc71;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Devanagari', sans-serif;
    min-height: 100vh;
    padding: 16px;
  }

  header {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.4rem;
    color: var(--accent);
    letter-spacing: 1px;
  }

  header p {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
  }

  .stat-box .num {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-box .label {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .stat-box.urgent .num { color: var(--urgent); }
  .stat-box.warning .num { color: var(--warning); }
  .stat-box.ok .num { color: var(--ok); }
  .stat-box.total .num { color: var(--accent); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'Noto Sans Devanagari', sans-serif;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  .add-btn {
    margin-left: auto;
    background: var(--accent);
    border: none;
    color: #000;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 700;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }

  .story-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
    transition: all 0.2s;
  }

  .story-card.urgent { border-left-color: var(--urgent); }
  .story-card.warning { border-left-color: var(--warning); }
  .story-card.ok { border-left-color: var(--ok); }
  .story-card.deadline { border-left-color: var(--blue); }
  .story-card.series { border-left-color: #9b59b6; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .story-title {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
  }

  .badge {
    font-size: 0.6rem;
    padding: 2px 7px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    font-weight: 600;
  }

  .badge.urgent { background: #3d0000; color: var(--urgent); border: 1px solid var(--urgent); }
  .badge.warning { background: #2d1f00; color: var(--warning); border: 1px solid var(--warning); }
  .badge.ok { background: #002d10; color: var(--ok); border: 1px solid var(--ok); }
  .badge.deadline { background: #001f3d; color: #5dade2; border: 1px solid #2980b9; }
  .badge.series { background: #1e0033; color: #bb8fce; border: 1px solid #9b59b6; }

  .card-meta {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .meta-item {
    font-size: 0.68rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .meta-item span {
    color: var(--text);
    font-weight: 600;
  }

  .card-note {
    font-size: 0.75rem;
    color: #aaa;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    line-height: 1.5;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .action-btn {
    font-size: 0.65rem;
    padding: 4px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-family: 'Noto Sans Devanagari', sans-serif;
    transition: all 0.15s;
  }

  .action-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  .action-btn.done { border-color: var(--ok); color: var(--ok); }
  .action-btn.done:hover { background: var(--ok); color: #000; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    margin-top: 40px;
  }

  .modal h3 {
    color: var(--accent);
    margin-bottom: 16px;
    font-size: 1rem;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-family: 'Noto Sans Devanagari', sans-serif;
  }

  .form-group textarea { resize: vertical; min-height: 60px; }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .modal-btns button {
    flex: 1;
    padding: 8px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-weight: 600;
  }

  .btn-save { background: var(--accent); color: #000; }
  .btn-cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .section-label {
    font-size: 0.7rem;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    margin-bottom: 8px;
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 0.85rem;
  }

  .today-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .auth-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .auth-bar.loading { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .auth-bar.signed-out { background: #1a1200; border: 1px solid var(--accent); color: var(--accent); }
  .auth-bar.signed-in { background: #001a0a; border: 1px solid var(--ok); color: var(--ok); }
  .auth-bar .auth-left { flex: 1; }
  .auth-btn { background: var(--accent); color: #000; border: none; padding: 5px 12px; border-radius: 3px; font-size: 0.7rem; cursor: pointer; font-weight: 700; font-family: 'Noto Sans Devanagari', sans-serif; white-space: nowrap; }
  .signout-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px; font-size: 0.65rem; cursor: pointer; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .signout-btn:hover { color: var(--urgent); border-color: var(--urgent); }
</style>
</head>
<body>

<header>
  <h1>📰 Story Follow-up Tracker</h1>
  <p id="dateDisplay"></p>
</header>

<div class="auth-bar loading" id="authBar">
  <span class="auth-left" id="authMsg">⏳ Connecting...</span>
</div>

<div class="stats">
  <div class="stat-box urgent"><div class="num" id="stat-urgent">0</div><div class="label">🔴 Urgent</div></div>
  <div class="stat-box warning"><div class="num" id="stat-warning">0</div><div class="label">🟡 Due Soon</div></div>
  <div class="stat-box ok"><div class="num" id="stat-ok">0</div><div class="label">🟢 On Track</div></div>
  <div class="stat-box total"><div class="num" id="stat-total">0</div><div class="label">📋 Total</div></div>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="filterStories('all', this)">सभी</button>
  <button class="filter-btn" onclick="filterStories('urgent', this)">Urgent</button>
  <button class="filter-btn" onclick="filterStories('today', this)">आज</button>
  <button class="filter-btn" onclick="filterStories('deadline', this)">Deadline</button>
  <button class="filter-btn" onclick="filterStories('series', this)">Series</button>
  <button class="add-btn" onclick="openAddModal()">+ नई Story</button>
</div>

<div id="storiesList"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">नई Story जोड़ें</h3>
    <div class="form-group">
      <label>Story का विषय *</label>
      <input type="text" id="f-title" placeholder="जैसे: PMFBY फसल बीमा योजना">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="f-category">
        <option value="agriculture">कृषि</option>
        <option value="govt">सरकारी योजना</option>
        <option value="panchayat">पंचायत राज</option>
        <option value="investigation">Investigation</option>
        <option value="event">Event/परेड</option>
        <option value="other">अन्य</option>
      </select>
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="f-type">
        <option value="followup">Follow-up</option>
        <option value="deadline">Fixed Deadline</option>
        <option value="series">Series</option>
        <option value="investigation">Investigation</option>
      </select>
    </div>
    <div class="form-group">
      <label>आखिरी खबर की तारीख</label>
      <input type="date" id="f-lastDate">
    </div>
    <div class="form-group">
      <label>अगली खबर की तारीख *</label>
      <input type="date" id="f-nextDate">
    </div>
    <div class="form-group">
      <label>Follow-up Frequency</label>
      <select id="f-frequency">
        <option value="daily">रोज़</option>
        <option value="3days">3-4 दिन</option>
        <option value="weekly">हफ्ता</option>
        <option value="10days">10 दिन</option>
        <option value="asneeded">जरूरत अनुसार</option>
      </select>
    </div>
    <div class="form-group">
      <label>नोट / अगला कदम</label>
      <textarea id="f-note" placeholder="क्या करना है, किससे मिलना है..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">रद्द करें</button>
      <button class="btn-save" onclick="saveStory()">Save करें</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ── Firebase setup ──────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCJw-jBCOdrvqLHrRTGbzQTGfSiyYX86e0",
  authDomain: "tafhim-tracker.firebaseapp.com",
  projectId: "tafhim-tracker",
  storageBucket: "tafhim-tracker.firebasestorage.app",
  messagingSenderId: "888815043166",
  appId: "1:888815043166:web:c919b49fa060848ed8aacf"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ── State ────────────────────────────────────────────────────────────
const TODAY = new Date();
TODAY.setHours(0,0,0,0);

let stories = [];
let editIndex = -1;
let currentFilter = 'all';
let currentUser = null;
let unsubSnap = null;

// ── Helper functions ─────────────────────────────────────────────────
function fmt(d) {
  if (!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('hi-IN', { day:'numeric', month:'short', year:'numeric' });
}

function daysUntil(dateStr) {
  if (!dateStr) return 999;
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  return Math.round((d - TODAY) / 86400000);
}

function getStatus(story) {
  const days = daysUntil(story.nextDate);
  if (days <= 2) return 'urgent';
  if (days <= 5) return 'warning';
  return 'ok';
}

function getBadgeLabel(story) {
  if (story.type === 'deadline') return 'DEADLINE';
  if (story.type === 'series') return 'SERIES';
  if (story.type === 'investigation') return 'INVESTIGATION';
  const days = daysUntil(story.nextDate);
  if (days < 0) return `${Math.abs(days)}d OVERDUE`;
  if (days === 0) return 'आज!';
  if (days === 1) return 'कल';
  return `${days}d बाद`;
}

function getBadgeClass(story) {
  if (story.type === 'deadline') return 'deadline';
  if (story.type === 'series') return 'series';
  return getStatus(story);
}

function freqLabel(f) {
  const map = { daily: 'रोज़', '3days': '3-4 दिन', weekly: 'हफ्ता', '10days': '10 दिन', asneeded: 'जरूरत अनुसार' };
  return map[f] || f;
}

function filterStories(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function markDone(index) {
  const s = stories[index];
  s.lastDate = new Date().toISOString().split('T')[0];

  const freqDays = { daily: 1, '3days': 3, weekly: 7, '10days': 10, asneeded: 7 };
  const days = freqDays[s.frequency] || 7;
  const next = new Date();
  next.setDate(next.getDate() + days);
  s.nextDate = next.toISOString().split('T')[0];

  save();
  render();
  alert(`✅ "${s.title}" — खबर mark हो गई!\nअगली follow-up: ${fmt(s.nextDate)}`);
}

function openAddModal() {
  editIndex = -1;
  document.getElementById('modalTitle').textContent = 'नई Story जोड़ें';
  document.getElementById('f-title').value = '';
  document.getElementById('f-category').value = 'agriculture';
  document.getElementById('f-type').value = 'followup';
  document.getElementById('f-lastDate').value = '';
  document.getElementById('f-nextDate').value = '';
  document.getElementById('f-frequency').value = 'weekly';
  document.getElementById('f-note').value = '';
  document.getElementById('modalOverlay').classList.add('active');
}

function editStory(index) {
  editIndex = index;
  const s = stories[index];
  document.getElementById('modalTitle').textContent = 'Story Edit करें';
  document.getElementById('f-title').value = s.title;
  document.getElementById('f-category').value = s.category;
  document.getElementById('f-type').value = s.type;
  document.getElementById('f-lastDate').value = s.lastDate || '';
  document.getElementById('f-nextDate').value = s.nextDate || '';
  document.getElementById('f-frequency').value = s.frequency;
  document.getElementById('f-note').value = s.note || '';
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function saveStory() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('Story का विषय जरूरी है!'); return; }

  const nextDate = document.getElementById('f-nextDate').value;
  if (!nextDate) { alert('अगली खबर की तारीख जरूरी है!'); return; }

  const story = {
    id: editIndex >= 0 ? stories[editIndex].id : Date.now(),
    title,
    category: document.getElementById('f-category').value,
    type: document.getElementById('f-type').value,
    lastDate: document.getElementById('f-lastDate').value,
    nextDate,
    frequency: document.getElementById('f-frequency').value,
    note: document.getElementById('f-note').value.trim()
  };

  if (editIndex >= 0) {
    stories[editIndex] = story;
  } else {
    stories.push(story);
  }

  save();
  closeModal();
  render();
}

function deleteStory(index) {
  if (!confirm(`"${stories[index].title}" delete करें?`)) return;
  stories.splice(index, 1);
  save();
  render();
}

function render() {
  const list = document.getElementById('storiesList');

  let filtered = stories.filter(s => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'urgent') return getStatus(s) === 'urgent';
    if (currentFilter === 'today') return daysUntil(s.nextDate) === 0;
    if (currentFilter === 'deadline') return s.type === 'deadline';
    if (currentFilter === 'series') return s.type === 'series';
    return true;
  });

  filtered.sort((a, b) => daysUntil(a.nextDate) - daysUntil(b.nextDate));

  let u = 0, w = 0, ok = 0;
  stories.forEach(s => {
    const st = getStatus(s);
    if (st === 'urgent') u++;
    else if (st === 'warning') w++;
    else ok++;
  });
  document.getElementById('stat-urgent').textContent = u;
  document.getElementById('stat-warning').textContent = w;
  document.getElementById('stat-ok').textContent = ok;
  document.getElementById('stat-total').textContent = stories.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">इस category में कोई story नहीं है।</div>';
    return;
  }

  list.innerHTML = filtered.map(s => {
    const status = getStatus(s);
    const badgeClass = getBadgeClass(s);
    const badgeLabel = getBadgeLabel(s);
    const realIndex = stories.indexOf(s);

    let cardClass = 'ok';
    if (status === 'urgent') cardClass = 'urgent';
    else if (status === 'warning') cardClass = 'warning';
    else if (s.type === 'deadline') cardClass = 'deadline';
    else if (s.type === 'series') cardClass = 'series';

    return `
    <div class="story-card ${cardClass}">
      <div class="card-top">
        <div class="story-title">${s.title}</div>
        <span class="badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="card-meta">
        <div class="meta-item">📅 अगली: <span>${fmt(s.nextDate)}</span></div>
        ${s.lastDate ? `<div class="meta-item">✅ पिछली: <span>${fmt(s.lastDate)}</span></div>` : ''}
        <div class="meta-item">🔄 <span>${freqLabel(s.frequency)}</span></div>
      </div>
      ${s.note ? `<div class="card-note">💬 ${s.note}</div>` : ''}
      <div class="card-actions">
        <button class="action-btn done" onclick="markDone(${realIndex})">✅ खबर गई</button>
        <button class="action-btn" onclick="editStory(${realIndex})">✏️ Edit</button>
        <button class="action-btn" onclick="deleteStory(${realIndex})">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

// ── Save: Firestore when signed in, localStorage fallback ────────────
function save() {
  if (currentUser) {
    db.collection('users').doc(currentUser.uid).collection('data').doc('stories')
      .set({ items: stories }).catch(e => console.error('Save error:', e));
  } else {
    localStorage.setItem('tafhim-stories', JSON.stringify(stories));
  }
}

// ── Default stories ──────────────────────────────────────────────────
function getDefaultStories() {
  return [
    { id: 1, title: 'PMFBY फसल बीमा योजना', category: 'agriculture', type: 'investigation', lastDate: '2026-05-18', nextDate: '2026-05-25', frequency: 'weekly', note: 'आज story file होनी है। उपनिदेशक कृषि प्रसार का version लेना बाकी है। एक हफ्ते बाद follow-up।' },

// ── Firestore real-time sync ─────────────────────────────────────────
function startSync() {
  if (unsubSnap) unsubSnap();
  const ref = db.collection('users').doc(currentUser.uid).collection('data').doc('stories');
  unsubSnap = ref.onSnapshot(snap => {
    if (snap.exists) {
      stories = snap.data().items || [];
    } else {
      const local = JSON.parse(localStorage.getItem('tafhim-stories') || '[]');
      stories = local.length > 0 ? local : getDefaultStories();
      save();
    }
    render();
  }, err => console.error('Sync error:', err));
}

// ── Auth ─────────────────────────────────────────────────────────────
function handleAuth() {
  if (currentUser) {
    if (unsubSnap) unsubSnap();
    auth.signOut();
  } else {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('Sign-in failed: ' + e.message));
  }
}

auth.onAuthStateChanged(user => {
  const bar = document.getElementById('authBar');
  if (user) {
    currentUser = user;
    bar.className = 'auth-bar signed-in';
    bar.innerHTML = `<span class="auth-left">☁️ Synced · ${user.email}</span><button class="signout-btn" onclick="handleAuth()">Sign Out</button>`;
    startSync();
  } else {
    currentUser = null;
    bar.className = 'auth-bar signed-out';
    bar.innerHTML = `<span class="auth-left">☁️ Sign in to sync across all devices</span><button class="auth-btn" onclick="handleAuth()">Google से Sign In</button>`;
    stories = JSON.parse(localStorage.getItem('tafhim-stories') || '[]');
    if (stories.length === 0) { stories = getDefaultStories(); localStorage.setItem('tafhim-stories', JSON.stringify(stories)); }
    render();
  }
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('hi-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
